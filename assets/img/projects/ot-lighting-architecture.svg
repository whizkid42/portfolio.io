<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
  </defs>
  <rect width="960" height="470" rx="14" fill="#ffffff"/>
  <text x="480" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#0f172a">Robotic Surgical Lighting: Six-Subsystem Architecture</text>

  <!-- Row of main pipeline -->
  <g font-size="12.5" fill="#475569" text-anchor="middle">
    <rect x="20" y="70" width="168" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="104" y="96" font-size="15" font-weight="700" fill="#1e3a8a">1. Smart Glasses</text>
    <text x="104" y="120">jaw-clench sensor</text>
    <text x="104" y="138">on the temple</text>
    <text x="104" y="160">laser pointer</text>
    <text x="104" y="178">and IMU</text>
    <text x="104" y="204" font-style="italic">input interface</text>

    <rect x="208" y="70" width="168" height="150" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="292" y="96" font-size="15" font-weight="700" fill="#4c1d95">2. Perception Unit</text>
    <text x="292" y="120">detects the laser dot</text>
    <text x="292" y="138">in camera images</text>
    <text x="292" y="160">fuses vision + IMU</text>
    <text x="292" y="178">for a 3D target</text>
    <text x="292" y="204" font-style="italic">3D localization</text>

    <rect x="396" y="70" width="168" height="150" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="480" y="96" font-size="15" font-weight="700" fill="#713f12">3. Lighting Planner</text>
    <text x="480" y="120">evaluates the target</text>
    <text x="480" y="138">selects a light arm</text>
    <text x="480" y="160">avoids obstacles</text>
    <text x="480" y="178">plans IK trajectory</text>
    <text x="480" y="204" font-style="italic">decision + planning</text>

    <rect x="584" y="70" width="168" height="150" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="668" y="96" font-size="15" font-weight="700" fill="#164e63">4. Control System</text>
    <text x="668" y="120">executes motion</text>
    <text x="668" y="138">PID joint control</text>
    <text x="668" y="160">CAN bus to</text>
    <text x="668" y="178">actuators</text>
    <text x="668" y="204" font-style="italic">real-time actuation</text>

    <rect x="772" y="70" width="168" height="150" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="856" y="96" font-size="15" font-weight="700" fill="#14532d">5. Lighting Arms</text>
    <text x="856" y="120">ceiling-mounted</text>
    <text x="856" y="138">multi-DOF arms</text>
    <text x="856" y="160">aim and focus the</text>
    <text x="856" y="178">surgical lights</text>
    <text x="856" y="204" font-style="italic">mechanical actuators</text>
  </g>
  <line x1="188" y1="145" x2="206" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="376" y1="145" x2="394" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="564" y1="145" x2="582" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="752" y1="145" x2="770" y2="145" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Safety system -->
  <rect x="208" y="300" width="544" height="96" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
  <text x="480" y="328" text-anchor="middle" font-size="15" font-weight="700" fill="#7f1d1d">6. Safety System</text>
  <text x="480" y="352" text-anchor="middle" font-size="12.5" fill="#475569">emergency stop · no-go zones · alignment verification</text>
  <text x="480" y="372" text-anchor="middle" font-size="12.5" fill="#475569">fallback and safe states from the FMEA</text>
  <g stroke="#b91c1c" stroke-width="2" stroke-dasharray="6 5" fill="none">
    <path d="M292,298 L292,222" marker-end="url(#s)"/>
    <path d="M480,298 L480,222" marker-end="url(#s)"/>
    <path d="M668,298 L668,222" marker-end="url(#s)"/>
    <path d="M752,348 L856,348 L856,222" marker-end="url(#s)"/>
  </g>
  <text x="480" y="440" text-anchor="middle" font-size="12.5" fill="#334155">Modeled in SysML (Block Definition and Internal Block Diagrams) with Modelio</text>
</svg>
