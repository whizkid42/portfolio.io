<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c2410c"/>
    </marker>
  </defs>
  <rect width="960" height="420" rx="14" fill="#ffffff"/>

  <!-- Operator side -->
  <rect x="24" y="24" width="270" height="372" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="159" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#1e3a8a">Operator Side</text>
  <rect x="54" y="84" width="210" height="64" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="159" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Sonographer</text>
  <text x="159" y="132" text-anchor="middle" font-size="12.5" fill="#475569">remote expert at the console</text>
  <rect x="54" y="200" width="210" height="84" rx="10" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
  <text x="159" y="228" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Grounded Haptic Master</text>
  <text x="159" y="249" text-anchor="middle" font-size="12.5" fill="#475569">impedance-based</text>
  <text x="159" y="266" text-anchor="middle" font-size="12.5" fill="#475569">force rendering</text>
  <line x1="130" y1="150" x2="130" y2="198" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="188" y1="198" x2="188" y2="150" stroke="#c2410c" stroke-width="2" marker-end="url(#f)"/>
  <text x="122" y="178" text-anchor="end" font-size="11.5" fill="#334155">motion</text>
  <text x="196" y="178" font-size="11.5" fill="#c2410c">felt force</text>

  <!-- Control layer -->
  <rect x="345" y="24" width="270" height="372" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="480" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Real-Time Control</text>
  <rect x="375" y="84" width="210" height="72" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="480" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Teleoperation Mapping</text>
  <text x="480" y="133" text-anchor="middle" font-size="12.5" fill="#475569">master pose → probe pose</text>
  <rect x="375" y="186" width="210" height="96" rx="10" fill="#fff" stroke="#64748b" stroke-width="2"/>
  <text x="480" y="214" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Admittance Controller</text>
  <text x="480" y="236" text-anchor="middle" font-size="12.5" fill="#475569">external layer over the</text>
  <text x="480" y="253" text-anchor="middle" font-size="12.5" fill="#475569">robot's internal controller</text>
  <text x="480" y="270" text-anchor="middle" font-size="12" font-style="italic" fill="#475569">M ẍ + D ẋ + K x = F</text>
  <line x1="480" y1="158" x2="480" y2="184" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Patient side -->
  <rect x="666" y="24" width="270" height="372" rx="12" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="801" y="54" text-anchor="middle" font-size="18" font-weight="700" fill="#14532d">Patient Side</text>
  <rect x="696" y="84" width="210" height="84" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/>
  <text x="801" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">7-DOF Manipulator</text>
  <text x="801" y="133" text-anchor="middle" font-size="12.5" fill="#475569">holds the ultrasound probe</text>
  <text x="801" y="151" text-anchor="middle" font-size="12.5" fill="#475569">compliant in contact</text>
  <rect x="696" y="214" width="210" height="68" rx="10" fill="#fff" stroke="#22c55e" stroke-width="2"/>
  <text x="801" y="242" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">Patient / Phantom</text>
  <text x="801" y="262" text-anchor="middle" font-size="12.5" fill="#475569">probe–tissue contact</text>
  <line x1="801" y1="170" x2="801" y2="212" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Cross links -->
  <line x1="266" y1="226" x2="373" y2="126" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="587" y1="226" x2="694" y2="134" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <!-- force feedback path -->
  <path d="M801,284 L801,340 L159,340 L159,286" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#f)"/>
  <line x1="480" y1="340" x2="480" y2="284" stroke="#c2410c" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#f)"/>
  <rect x="300" y="352" width="360" height="30" rx="6" fill="#fff7ed"/>
  <text x="480" y="372" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">measured contact force fed back to controller and operator</text>
</svg>
