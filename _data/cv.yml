        summary: Pneumatically actuated silicone (Dragon Skin / Ecoflex) PneuNet toe separator for post-operative bunion recovery, with air chambers formed by a dissolvable sugar-insert casting method.
        highlights:
          - Took part in every stage, from research and requirements through mould design, multi-material casting, pneumatic assembly and on-foot testing.

      - name: Biomechanics of Taekwondo Punches
        url: https://whizkid42.github.io/projects/8_project/
        date: 2025-05
        summary: Motion capture and force-plate study of dominant vs non-dominant punches, with OpenSim inverse kinematics and inverse dynamics of the hip, knee and ankle.

