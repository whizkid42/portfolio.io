    city: Bengaluru
    region: Karnataka, India
  image: ""
  summary: >-
    Robotics engineer focused on **medical devices and surgical robotics**, with hands-on experience taking electromechanical
    systems from concept to tested prototype. At IIT Madras Research Park I developed the force-control and haptic
    teleoperation stack for a 7-DOF robot-assisted ultrasound system and built the test phantoms used to validate it. My
    background spans control (admittance/impedance, haptics), mechanical design and fabrication, sensing and perception,
    and system architecture with risk analysis for regulated devices. Based in Bengaluru and looking for R&D roles in
    medtech and surgical robotics.

  social_networks:
    - network: LinkedIn
      username: devsakaria
    - network: GitHub
      username: whizkid42

  sections:
    Experience:
      - company: Healthcare Technology Innovation Centre (HTIC), IIT Madras Research Park
        position: Robotics Engineer, Robot-Assisted Tele-Ultrasound
        location: Chennai, India
        start_date: 2026-01
        end_date: 2026-09
        highlights:
          - Developed an **admittance-based force control framework** for a 7-DOF manipulator, giving compliant, stable probe–tissue contact for robot-assisted ultrasonography.
          - Designed and implemented a **real-time external control layer** on top of the robot's internal controller, improving force tracking and responsiveness for scanning tasks.
          - Architected and prototyped a **grounded haptic master interface** with impedance-based force feedback for intuitive, safe teleoperation.
          - Modelled system dynamics and tuned controller parameters for stability and safe human–robot interaction in a clinical setting.
          - Designed and built a **pneumatically actuated breathing phantom**, taking it from a first prototype to a robot-ready test bed that reproduces respiratory motion for validating contact control on a moving body.

      - company: Hourglass Medical (M.Eng Capstone, University of Illinois)
        position: Robotics Systems Design Intern
        location: Champaign, IL, USA
        start_date: 2025-05
        end_date: 2025-08
        highlights:
          - Led the **system architecture** of a hands-free robotic surgical lighting system, controlled by smart glasses with a jaw-clench sensor and laser pointer, using **MBSE in SysML** (block definition and internal block diagrams) and the V-model.
          - Defined the six subsystems and their interfaces (glasses, perception, lighting planner, control, light arms, safety), including laser-spot 3D localization, IK-based obstacle-aware motion planning and CAN-based actuation over ROS 2.
          - Performed a high-level **FMEA** and designed the safety system (emergency stop, no-go zones, IR proximity sensing, manual override).

      - company: Robert Bosch Centre for Cyber-Physical Systems, Indian Institute of Science (IISc)
        position: Robotics Intern, Multi-Robot Localization
        location: Bengaluru, India
        start_date: 2024-01
        end_date: 2024-06
        highlights:
          - Built multi-robot localization pipelines in ROS that fuse fixed infrastructure-camera poses with on-board LiDAR, IMU, wheel odometry and depth camera in an **EKF**, feeding RTAB-Map SLAM.
          - Integrated keypoint-based (YOLOv8-pose + PnP) **6D pose estimation** with uncertainty into the localization stack.
          - Improved localization accuracy by about **39%** through systematic tuning and validation in Gazebo, Isaac Sim and on the Volta AMR fleet.

      - company: Sansera Engineering
        position: Automation Intern
        location: Bengaluru, India
        start_date: 2022-12
        end_date: 2023-02
        highlights:
          - Designed an automated bearing-assembly station, developed its PLC logic and HMI, and integrated an inline vision-inspection system.

